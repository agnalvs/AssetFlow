# ---------------------------------------------------------------------------
# AssetFlow — Configuração de motores (gavetas)
# ---------------------------------------------------------------------------
# Este arquivo controla QUAIS gavetas existem e COMO elas são configuradas.
# Nada aqui pode estar hardcoded no código (plano §65).
#
# Trocar um motor por outro é uma alteração de CONFIGURAÇÃO, não de código.
# ---------------------------------------------------------------------------

# Versão do Engine API que este backend implementa (plano §10).
# Motores que declarem outra versão são rejeitados pelo EngineRegistry.
engine_api_version: "1"

discovery:
  # Diretórios varridos em busca de `manifest.json` de engines.
  paths:
    - "assetflow/generation/engines"
  # Allowlist de segurança (plano §64): somente estes engine ids podem ser
  # carregados. `null` desativa a verificação (apenas para desenvolvimento).
  allowlist:
    - "mock-image-v1"
    - "mock-pixel-alt-v1"
    - "diffusers-sdxl-v1"
    - "flux-pixel-v1"
    - "sdpixl-v1"
    - "pixel-forge-v1"
    - "texel-style-v1"

defaults:
  # Tempo máximo padrão de uma geração, quando o manifesto não declara o seu.
  timeout_s: 300
  # TTL do cache de health check por engine.
  health_cache_ttl_s: 15
  # Lazy loading (plano §36): o modelo só é carregado no primeiro job.
  lazy_load: true

engines:
  # -------------------------------------------------------------------------
  # Gaveta de referência sem IA — valida toda a arquitetura antes da GPU.
  # -------------------------------------------------------------------------
  mock-image-v1:
    enabled: true
    options:
      # Latência simulada, para exercitar progresso/cancelamento/timeout.
      simulated_latency_ms: 120
      palette: "spectrum"

  # -------------------------------------------------------------------------
  # Segunda gaveta — existe para provar a substituição de motores (plano §67).
  # Desabilitada por padrão; o Swap Engine Test liga/desliga em runtime.
  # -------------------------------------------------------------------------
  mock-pixel-alt-v1:
    enabled: false
    options:
      simulated_latency_ms: 80
      symmetry: true

  # -------------------------------------------------------------------------
  # Primeira gaveta real. Exige GPU + `pip install -e .[diffusers]` com o
  # torch de CUDA (veja SETUP.md). Habilitar NÃO exige alterar código.
  #
  # PERFIL ATIVO — GPU PEQUENA (4-6GB, ex.: GTX 1050 Ti).
  #
  # Por que este perfil, e não o de 12GB: numa placa de 4GB o SDXL base não
  # cabe na VRAM, e o Windows não falha — ele pagina os pesos para a memória
  # compartilhada e segue rodando pelo PCIe. O resultado medido nesta máquina
  # foi ~86s por passo de denoising: 7 dos 30 passos em 600s, com o job
  # morrendo no deadline do motor sem nunca entregar imagem.
  #
  # SDXL-Turbo resolve pela raiz: 1-4 passos em vez de 30. O offload
  # sequencial troca velocidade por VRAM, que é o recurso que falta aqui.
  #
  # Esta é uma exceção consciente à regra de manter diferença de hardware em
  # variável de ambiente: `ASSETFLOW_*` cobre motor, device e precisão, mas
  # não troca o **modelo** — e é justamente a troca de modelo que salva esta
  # placa. Em GPU maior, use o PERFIL B logo abaixo.
  # -------------------------------------------------------------------------
  diffusers-sdxl-v1:
    enabled: true
    model:
      # Turbo é destilado para poucos passos; a contrapartida é guidance 0
      # (ver `guidance_scale` abaixo) e menos aderência a prompt longo.
      id: "stabilityai/sdxl-turbo"
      revision: null
      variant: "fp16"
    device:
      type: "auto"        # auto | cuda | mps | cpu
    precision:
      type: "fp16"        # fp16 | bf16 | fp32
    runtime:
      # Baratos e mantidos ligados de propósito: cortam o pico de VRAM na
      # atenção e no decode do VAE, que é onde 4GB estoura primeiro.
      enable_attention_slicing: true
      enable_vae_slicing: true
      # Offload: mova para a GPU só o que estiver em uso (plano §38).
      #   model_cpu_offload      → precisa caber o maior componente (~5GB)
      #   sequential_cpu_offload → cabe em ~2GB, porém bem mais lento
      #
      # Com 4GB o sequencial é o único que serve: o model_cpu_offload pediria
      # ~5GB só para a UNet, mais do que a placa inteira tem.
      enable_model_cpu_offload: false
      enable_sequential_cpu_offload: true
    timeouts:
      # Sobrescrevem o manifesto quando este hardware for diferente do de
      # referência. Omitir = usar o que a gaveta declara.
      #
      # ATENÇÃO: quem manda no fim é `ASSETFLOW_JOB_TIMEOUT_S` (padrão 900s),
      # que envolve o pipeline inteiro no worker. Não adianta alargar aqui e
      # deixar o teto do worker menor — ele mata o job antes. Ver SETUP.md.
      timeout_s: 1800       # 30 min: o offload sequencial é lento por projeto
      load_timeout_s: 3600  # inclui o download do modelo na primeira execução
    options:
      # Mapeamento do knob abstrato `quality` para passos de inferência.
      # O contrato universal NUNCA carrega `steps` (plano §20).
      quality_steps:
        draft: 1
        standard: 2
        high: 4
      guidance_scale: 0.0   # SDXL-Turbo exige guidance 0

    # -----------------------------------------------------------------------
    # PERFIL B — GPU com 12GB+ de VRAM. Copie por cima dos campos acima.
    # O manifesto declara recommended_vram_mb: 12000, minimum_vram_mb: 8000.
    # Com essa folga o SDXL base cabe inteiro na GPU e entrega mais qualidade
    # por imagem do que o Turbo.
    #
    #   model:
    #     id: "stabilityai/stable-diffusion-xl-base-1.0"
    #     variant: "fp16"
    #   device:    { type: "auto" }
    #   precision: { type: "fp16" }
    #   runtime:
    #     enable_attention_slicing: true
    #     enable_vae_slicing: true
    #     enable_model_cpu_offload: false        # ligue se der OOM
    #     enable_sequential_cpu_offload: false
    #   timeouts:
    #     timeout_s: 600         # sem offload, 4 variações levam ~1-2 min
    #     load_timeout_s: 3600
    #   options:
    #     quality_steps: { draft: 18, standard: 30, high: 45 }
    #     guidance_scale: 6.5
    #
    # Trocando de perfil, o `guidance_scale` anda junto com o modelo: o Turbo
    # exige 0, e o base lavado em 0 é o sintoma de ter esquecido este campo.
    # -----------------------------------------------------------------------

  # =========================================================================
  # MÚLTIPLOS MOTORES DE PIXEL ART (plano de seleção de modelos, §2 e §12-§15)
  #
  # As quatro gavetas abaixo entram DESABILITADAS. Não é excesso de cautela:
  # três delas exigem alguma coisa que esta máquina pode não ter — GPU, um
  # clone do SD-πXL, um binário Rust compilado — e uma gaveta habilitada que
  # não roda entra na cadeia de fallback e transforma cada falha do motor
  # principal em uma segunda falha, mais lenta.
  #
  # A exceção é `texel-style-v1`, que só depende de Python e por isso nasce
  # habilitada logo abaixo.
  # =========================================================================

  # -------------------------------------------------------------------------
  # FLUX Pixel — FLUX.2-klein-4B + LoRA de Pixel Art (plano §2.1 e §8.1).
  #
  # ANTES DE HABILITAR, confira os dois ids no HuggingFace. Um repositório
  # pode mudar de nome ou de organização, e um id errado só aparece como
  # falha de download no primeiro job — a mensagem de erro do loader diz
  # exatamente qual id ele tentou.
  #
  # Requer `pip install -e .[diffusers]` com o torch de CUDA (veja SETUP.md),
  # mais `peft` para a LoRA.
  # -------------------------------------------------------------------------
  flux-pixel-v1:
    enabled: false
    model:
      id: "black-forest-labs/FLUX.2-klein-4B"
      revision: null
      variant: null
    device:
      type: "auto"
    precision:
      type: "bf16"        # o padrão do FLUX; fp16 também funciona
    runtime:
      enable_attention_slicing: true
      enable_vae_slicing: true
      # Em GPU pequena, ligue um dos dois (nunca os dois juntos).
      enable_model_cpu_offload: false
      enable_sequential_cpu_offload: false
    timeouts:
      timeout_s: 900
      load_timeout_s: 3600
    options:
      # FLUX-klein é destilado: poucos passos bastam.
      quality_steps:
        draft: 4
        standard: 8
        high: 16
      guidance_scale: 3.5
      lora:
        id: "Limbicnation/pixel-art-lora"
        # `weight_name` só é necessário quando o repositório tem mais de um
        # arquivo de pesos; `null` deixa o Diffusers escolher.
        weight_name: null
        scale: 1.0
        # Palavra de ativação da LoRA. O adapter a põe na frente do prompt.
        trigger: "pixel art"

  # -------------------------------------------------------------------------
  # SD-πXL (plano §2.2 e §8.2) — qualidade de referência, tempo em horas.
  #
  # Integração por processo externo: aponte `command` para a CLI do clone do
  # projeto. Os placeholders disponíveis são {prompt}, {negative}, {width},
  # {height}, {logical_width}, {logical_height}, {max_colors}, {seed},
  # {steps}, {output}, {output_dir} e {workspace}.
  #
  # ATENÇÃO ao teto do worker: `ASSETFLOW_JOB_TIMEOUT_S` (padrão 900s) envolve
  # o pipeline inteiro. Sem alargá-lo, o job morre muito antes do
  # `process_timeout_s` abaixo.
  # -------------------------------------------------------------------------
  sdpixl-v1:
    enabled: false
    model:
      id: "sd-pixl"
    timeouts:
      timeout_s: 7200
      load_timeout_s: 60
    options:
      command: []
      # command:
      #   - "python"
      #   - "main.py"
      #   - "--prompt"
      #   - "{prompt}"
      #   - "--size"
      #   - "{logical_width}"
      #   - "--colors"
      #   - "{max_colors}"
      #   - "--seed"
      #   - "{seed}"
      #   - "--output"
      #   - "{output}"
      # working_dir: "D:/ferramentas/sd-pixl"
      output_glob: "*.png"
      process_timeout_s: 7200
      quality_steps:
        draft: 200
        standard: 500
        high: 1000

  # -------------------------------------------------------------------------
  # Pixel Forge (plano §2.3 e §8.3) — sprites 32×32 nativos, em Rust.
  #
  # `binary` é o executável compilado do projeto. O backend não é acoplado ao
  # runtime Rust: ele só executa um processo e lê os PNGs que saírem.
  # Placeholders: {prompt}, {seed}, {size}, {width}, {height}, {max_colors},
  # {model}, {output}, {output_dir}, {workspace}.
  # -------------------------------------------------------------------------
  pixel-forge-v1:
    enabled: false
    model:
      id: "pixel-forge"
    options:
      binary: ""
      # binary: "D:/ferramentas/pixel-forge/target/release/pixel-forge.exe"
      args: []
      # args: ["--prompt", "{prompt}", "--seed", "{seed}", "--out", "{output}"]
      output_glob: "*.png"
      process_timeout_s: 300

  # -------------------------------------------------------------------------
  # Texel-style Agent (plano §9 e §15) — desenha pixel a pixel, sem modelo.
  #
  # HABILITADA por padrão, e é a única das quatro que pode ser: ela não baixa
  # nada, não usa GPU e não depende de nenhum projeto externo. Roda em
  # milissegundos e é determinística por seed, o que a torna também a gaveta
  # mais confiável da estante para servir de fallback.
  # -------------------------------------------------------------------------
  texel-style-v1:
    enabled: true
    options:
      # Passadas do Review Loop (plano §9.4). Duas resolvem o caso real;
      # mais do que isso corre o risco de apagar sprites finos pixel a pixel.
      review_passes: 2
