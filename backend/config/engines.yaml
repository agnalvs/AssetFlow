# ---------------------------------------------------------------------------
# AssetFlow — Configuração de motores (gavetas)
# ---------------------------------------------------------------------------
# Este arquivo controla QUAIS gavetas existem e COMO elas são configuradas.
# Nada aqui pode estar hardcoded no código (plano §65).
#
# Trocar um motor por outro é uma alteração de CONFIGURAÇÃO, não de código.
# ---------------------------------------------------------------------------

# Versão do Engine API que este backend implementa (plano §10).
# Motores que declarem outra versão são rejeitados pelo EngineRegistry.
engine_api_version: "1"

discovery:
  # Diretórios varridos em busca de `manifest.json` de engines.
  paths:
    - "assetflow/generation/engines"
  # Allowlist de segurança (plano §64): somente estes engine ids podem ser
  # carregados. `null` desativa a verificação (apenas para desenvolvimento).
  allowlist:
    - "mock-image-v1"
    - "mock-pixel-alt-v1"
    - "diffusers-sdxl-v1"

defaults:
  # Tempo máximo padrão de uma geração, quando o manifesto não declara o seu.
  timeout_s: 300
  # TTL do cache de health check por engine.
  health_cache_ttl_s: 15
  # Lazy loading (plano §36): o modelo só é carregado no primeiro job.
  lazy_load: true

engines:
  # -------------------------------------------------------------------------
  # Gaveta de referência sem IA — valida toda a arquitetura antes da GPU.
  # -------------------------------------------------------------------------
  mock-image-v1:
    enabled: true
    options:
      # Latência simulada, para exercitar progresso/cancelamento/timeout.
      simulated_latency_ms: 120
      palette: "spectrum"

  # -------------------------------------------------------------------------
  # Segunda gaveta — existe para provar a substituição de motores (plano §67).
  # Desabilitada por padrão; o Swap Engine Test liga/desliga em runtime.
  # -------------------------------------------------------------------------
  mock-pixel-alt-v1:
    enabled: false
    options:
      simulated_latency_ms: 80
      symmetry: true

  # -------------------------------------------------------------------------
  # Primeira gaveta real. Exige GPU + `pip install -e .[diffusers]` com o
  # torch de CUDA (veja SETUP.md). Habilitar NÃO exige alterar código.
  #
  # PERFIL ATIVO — GPU com 12GB+ de VRAM (offload desligado).
  # O manifesto declara recommended_vram_mb: 12000, minimum_vram_mb: 8000.
  # Com menos que isso, use o PERFIL B mais abaixo.
  # -------------------------------------------------------------------------
  diffusers-sdxl-v1:
    enabled: true
    model:
      id: "stabilityai/stable-diffusion-xl-base-1.0"
      revision: null
      variant: "fp16"
    device:
      type: "auto"        # auto | cuda | mps | cpu
    precision:
      type: "fp16"        # fp16 | bf16 | fp32
    runtime:
      # Baratos e mantidos ligados de propósito: com `variations: 4` o lote
      # sobe o pico de VRAM justamente na atenção e no decode do VAE, que é
      # onde 12GB deixa de ser folgado. Desligue os dois só se sobrar VRAM.
      enable_attention_slicing: true
      enable_vae_slicing: true
      # Offload: mova para a GPU só o que estiver em uso (plano §38).
      #   model_cpu_offload      → precisa caber o maior componente (~5GB)
      #   sequential_cpu_offload → cabe em ~2GB, porém bem mais lento
      #
      # Ambos DESLIGADOS aqui: com 12GB o SDXL em fp16 (~7GB de pesos) cabe
      # inteiro na GPU, e offload só serve para trocar velocidade por VRAM
      # que não falta. Ligue um deles apenas se der CUDA out of memory.
      enable_model_cpu_offload: false
      enable_sequential_cpu_offload: false
    timeouts:
      # Sobrescrevem o manifesto quando este hardware for diferente do de
      # referência. Omitir = usar o que a gaveta declara.
      #
      # ATENÇÃO: quem manda no fim é `ASSETFLOW_JOB_TIMEOUT_S` (padrão 900s),
      # que envolve o pipeline inteiro no worker. Não adianta alargar aqui e
      # deixar o teto do worker menor — ele mata o job antes. Ver SETUP.md.
      timeout_s: 600        # sem offload, 4 variações levam ~1-2 min
      load_timeout_s: 3600  # inclui o download de ~7GB na primeira execução
    options:
      # Mapeamento do knob abstrato `quality` para passos de inferência.
      # O contrato universal NUNCA carrega `steps` (plano §20).
      quality_steps:
        draft: 18
        standard: 30
        high: 45
      guidance_scale: 6.5

    # -----------------------------------------------------------------------
    # PERFIL B — GPU PEQUENA (4-6GB, ex.: GTX 1050 Ti). Copie por cima dos
    # campos acima. Usa SDXL-Turbo, que gera em 1-4 passos em vez de 30.
    #
    #   model:
    #     id: "stabilityai/sdxl-turbo"
    #     variant: "fp16"
    #   device:   { type: "cuda" }
    #   precision: { type: "fp16" }
    #   runtime:
    #     enable_attention_slicing: true
    #     enable_vae_slicing: true
    #     enable_model_cpu_offload: false
    #     enable_sequential_cpu_offload: true    # obrigatório com 4GB
    #   timeouts:
    #     timeout_s: 1800        # 30 min: offload sequencial é lento
    #     load_timeout_s: 3600   # inclui o download de ~7GB na 1ª vez
    #   options:
    #     quality_steps: { draft: 1, standard: 2, high: 4 }
    #     guidance_scale: 0.0    # SDXL-Turbo exige guidance 0
    #
    # Com este perfil, alargue TAMBÉM o teto do worker, senão os 1800s acima
    # são inalcançáveis:  ASSETFLOW_JOB_TIMEOUT_S=1800
    # -----------------------------------------------------------------------
