# ---------------------------------------------------------------------------
# AssetFlow — Configuração de motores (gavetas)
# ---------------------------------------------------------------------------
# Este arquivo controla QUAIS gavetas existem e COMO elas são configuradas.
# Nada aqui pode estar hardcoded no código (plano §65).
#
# Trocar um motor por outro é uma alteração de CONFIGURAÇÃO, não de código.
#
# Gavetas: a `desenhista-v1` (o Claude desenha, por MCP) e as duas de
# referência. Os motores de difusão, as pontes para projetos externos e a API
# paga saíram na Fase 0 do plano desenhista
# (backend/docs/PLANO_DESENHISTA_MCP.md).
#
# Desde a Fase A do plano do app (backend/docs/PLANO_APP_DESENHISTA.md), a
# desenhista é o único gerador do app. As gavetas de referência continuam aqui
# porque a suíte de testes roda sobre elas, mas só são REGISTRADAS no ambiente
# de testes (`AppEnvironment.TEST`, ligado por código no tests/conftest.py):
# em development e em production elas não existem para o app.
# ---------------------------------------------------------------------------

# Versão do Engine API que este backend implementa (plano §10).
# Motores que declarem outra versão são rejeitados pelo EngineRegistry.
engine_api_version: "1"

# O gerador do app (Fase B do plano do app): a gaveta que desenha os pedidos
# feitos na tela. Ela é pedida pelo nome, sem fallback, e o spec de cada pedido
# já nasce com ela — é o que a pré-visualização mostra e o que o desenho executa.
gerador: "desenhista-v1"

discovery:
  # Diretórios varridos em busca de `manifest.json` de engines.
  paths:
    - "assetflow/generation/engines"
  # Allowlist de segurança (plano §64): somente estes engine ids podem ser
  # carregados. `null` desativa a verificação (apenas para desenvolvimento).
  allowlist:
    - "desenhista-v1"
    - "mock-image-v1"
    - "mock-pixel-alt-v1"

defaults:
  # Tempo máximo padrão de uma geração, quando o manifesto não declara o seu.
  timeout_s: 300
  # TTL do cache de health check por engine.
  health_cache_ttl_s: 15
  # Lazy loading (plano §36): o modelo só é carregado no primeiro job.
  lazy_load: true

engines:
  # -------------------------------------------------------------------------
  # O Claude desenha (plano desenhista, Fase 1). A gaveta transforma uma
  # receita curta de camadas em sprite na grade lógica; não carrega modelo e
  # não usa GPU. Só atende pedidos que tragam a receita em
  # engine_options["desenhista-v1"]["receita"] — o servidor MCP manda; o botão
  # "Gerar" da tela não. Formato da receita: backend/docs/DESENHISTA.md.
  # -------------------------------------------------------------------------
  desenhista-v1:
    enabled: true
    options:
      # Comandos opcionais da receita, um interruptor por lote do
      # FUNDAMENTOS_E_FERRAMENTAS.md (sessão de lotes, 2026-11-25). Desligado,
      # a receita que usar o grupo é recusada dizendo isso, e o formato que o
      # MCP mostra não o cita. Cada um muda com
      # ASSETFLOW_ENGINE_DESENHISTA_V1_OPTIONS='{"comandos_cor_e_luz": false}'.
      comandos_cor_e_luz: true
      comandos_construcao: true
      comandos_linha: true
      comandos_acabamento: true

  # -------------------------------------------------------------------------
  # Gaveta de referência sem IA — exercita a arquitetura nos testes.
  # Só é registrada no ambiente de testes (catalog.dev_only no manifesto).
  # -------------------------------------------------------------------------
  mock-image-v1:
    enabled: true
    options:
      # Latência simulada, para exercitar progresso/cancelamento/timeout.
      simulated_latency_ms: 120
      palette: "spectrum"

  # -------------------------------------------------------------------------
  # Segunda gaveta — existe para provar a substituição de motores (plano §67).
  # Desabilitada por padrão; o Swap Engine Test liga/desliga em runtime. Como a
  # de cima, só é registrada no ambiente de testes.
  # -------------------------------------------------------------------------
  mock-pixel-alt-v1:
    enabled: false
    options:
      simulated_latency_ms: 80
      symmetry: true
