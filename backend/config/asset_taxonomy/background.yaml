# ---------------------------------------------------------------------------
# Taxonomia — BACKGROUND (plano Text→JSON §4 e §5)
# ---------------------------------------------------------------------------
# ATENÇÃO ao termo "background": ele também aparece em "transparent
# background", que é uma restrição de FUNDO, não um pedido de cenário. Quem
# desfaz essa ambiguidade é o ExplicitConstraintExtractor: ele consome
# "transparent background"/"sem fundo" ANTES da classificação, e o que sobra
# para o classificador já não tem o termo. Por isso "tree, transparent
# background" continua sendo um prop.
# ---------------------------------------------------------------------------
