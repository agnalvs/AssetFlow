# ---------------------------------------------------------------------------
# Taxonomia — CHARACTER (plano Text→JSON §3 a §5)
# ---------------------------------------------------------------------------
# `markers` são termos que nomeiam o PRÓPRIO tipo de asset ("personagem",
# "npc"). `keywords` são sujeitos que pertencem ao tipo ("cavaleiro", "mago").
# Um marker sempre ganha de uma keyword — quem escreve "floresta de fundo"
# quer um cenário, mesmo que "floresta" também seja um sujeito conhecido.
#
# `priority` só desempata entre matches da mesma classe e do mesmo tamanho.
# Character vem primeiro de propósito: "guerreiro na floresta" é um
# personagem em pé numa floresta, não uma floresta com um guerreiro dentro.
# ---------------------------------------------------------------------------
type: character
priority: 100

markers:
  en: [character, npc, playable character, player character, hero unit, sprite character]
  pt: [personagem, protagonista, herói, heroi, npc]

