# ---------------------------------------------------------------------------
# Taxonomia — CHARACTER (plano Text→JSON §3 a §5)
# ---------------------------------------------------------------------------
# `markers` são termos que nomeiam o PRÓPRIO tipo de asset ("personagem",
# "npc"). `keywords` são sujeitos que pertencem ao tipo ("cavaleiro", "mago").
# Um marker sempre ganha de uma keyword — quem escreve "floresta de fundo"
# quer um cenário, mesmo que "floresta" também seja um sujeito conhecido.
#
# `priority` só desempata entre matches da mesma classe e do mesmo tamanho.
# Character vem primeiro de propósito: "guerreiro na floresta" é um
# personagem em pé numa floresta, não uma floresta com um guerreiro dentro.
#
# Uma linha por palavra, com todas as formas dela: masculino, feminino e
# plural. O classificador casa a palavra inteira e não flexiona — "arqueiras"
# não casa "arqueira" —, então forma que não está escrita aqui não existe
# para ele. Agrupar por palavra é o que deixa a forma que falta visível.
# Acento não precisa ser repetido sem acento: a carga normaliza os dois.
#
# `tests/test_taxonomia_flexoes.py` confere que toda forma masculina tem a
# feminina na mesma lista (quando ela existe) e que todo termo de
# `categories` é um sujeito que o classificador enxerga.
# ---------------------------------------------------------------------------
