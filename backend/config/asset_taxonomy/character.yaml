# ---------------------------------------------------------------------------
# Topologia corporal (pesquisa PixelLab — `character.body_type`)
# ---------------------------------------------------------------------------
# Eixo DIFERENTE de `categories`, e a diferença importa: um goblin é
# `creature` de corpo humanoide; um lobo é `creature` quadrúpede. Categoria
# diz que TIPO de coisa é; topologia diz que FORMA o corpo tem — e é a forma
# que o gerador precisa saber.
#
# Confundir os dois é o mesmo erro do `asset_type` virando `character` para
# uma árvore, um nível abaixo.
#
# Termo ausente vira `unknown`, e `unknown` não entra no prompt: é silêncio
# honesto, não palpite. Acrescentar um bicho aqui é editar este arquivo,
# nunca um `.py`.
# ---------------------------------------------------------------------------
