# ---------------------------------------------------------------------------
# Corpo implícito na categoria (`character.body_type`, origem
# `category_inference`)
# ---------------------------------------------------------------------------
# Quando nenhum termo do pedido nomeia a forma do corpo, a categoria resolvida
# responde — mas só a categoria em que TODO membro tem o mesmo corpo. O
# resolvedor do spec faz isso uma vez; o recorte e o prompt só leem o
# resultado. Categoria mista fica de fora, e o corpo continua `unknown`:
#
#   creature   — goblin é humanoide, lobo quadrúpede, slime amorfo, dragão
#                serpentino
#   mechanical — robô e androide já são humanoid em `body_types`; um drone ou
#                um tanque não seriam
#
# A chave é uma categoria de `categories` e o valor, uma forma de
# `body_types`; o que não existir nos dois é ignorado com aviso na carga.
# ---------------------------------------------------------------------------
category_body_types:
  humanoid: humanoid
