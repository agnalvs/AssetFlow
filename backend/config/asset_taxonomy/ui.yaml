# ---------------------------------------------------------------------------
# Taxonomia — UI (plano Text→JSON §3)
# ---------------------------------------------------------------------------
# `ui` é o componente de tela (botão, painel, barra de vida). A peça isolada
# que representa uma coisa — o ícone de item, o emblema — é `icon`, e mora em
# icon.yaml: são contratos de saída diferentes, e o §19 mostra controles
# diferentes para cada um.
# ---------------------------------------------------------------------------
