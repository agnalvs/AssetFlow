# ---------------------------------------------------------------------------
# AssetFlow — Generation Profiles (plano §25)
# ---------------------------------------------------------------------------
# Um profile descreve O QUE deve ser produzido, nunca COM QUAL MOTOR.
# Repare que nenhuma linha deste arquivo cita SDXL, FLUX ou qualquer modelo.
# ---------------------------------------------------------------------------

profiles:
  pixel_character_64:
    display_name: "Personagem Pixel Art 64×64"
    capability: "text_to_image.pixel"
    pipeline: "pixel.character"
    # Contrato Pixel Exact deste profile (config/pixel_profiles.yaml).
    # Ele é a fonte única da verdade técnica do arquivo final: resolução
    # lógica real, paleta, alpha binário, canvas, preview e quais requisitos
    # são obrigatórios. Os campos abaixo continuam descrevendo o produto e
    # alimentando a API; um teste garante que os dois não divergem.
    pixel_profile: "pixel_character_64_strict"
    asset:
      type: "character"
      mode: "pixel"
    output:
      logical_width: 64
      logical_height: 64
      # Resolução em que o motor gera antes do downscale lógico.
      #
      # ATENÇÃO: este número é o único campo do arquivo que depende do MODELO
      # ativo em config/engines.yaml, e o valor certo inverte entre os dois
      # perfis que aquele arquivo oferece:
      #
      #   SDXL base   -> 1024. Medido: em 512 ele sai da distribuição de
      #                  treino e devolve grade de tiles no lugar de um
      #                  personagem.
      #   SDXL-Turbo  -> 512.  É a resolução em que o Turbo foi destilado.
      #                  Medido nesta máquina, mesma seed e mesmo prompt:
      #                  em 1024 saíram dois personagens colados e cobertos
      #                  de lâminas (órfãos 0,207 / microclusters 0,821); em
      #                  512, um guerreiro só com silhueta limpa (0,111 /
      #                  0,740) — e em 9,3s em vez de 21,8s.
      #
      # O perfil ativo hoje é o do Turbo, daí o 512. Trocando engines.yaml
      # para o perfil de 12GB, este campo volta para 1024 junto.
      render_width: 512
      render_height: 512
      variations: 4
      transparent: true
    palette:
      size: 16
      strategy: "adaptive"     # adaptive | fixed
      fixed_colors: []
    postprocessing:
      pixel_cleanup: true
      antialiasing: false
      alpha_threshold: 128
      validate_color_count: true
      validate_grid: true
      thumbnail_scale: 4

  pixel_character_32:
    display_name: "Personagem Pixel Art 32×32"
    capability: "text_to_image.pixel"
    pipeline: "pixel.character"
    pixel_profile: "pixel_character_32_strict"
    asset:
      type: "character"
      mode: "pixel"
    output:
      logical_width: 32
      logical_height: 32
      # Ver a nota sobre render x modelo em `pixel_character_64`.
      render_width: 512
      render_height: 512
      variations: 4
      transparent: true
    palette:
      size: 12
      strategy: "adaptive"
    postprocessing:
      pixel_cleanup: true
      antialiasing: false
      alpha_threshold: 128
      validate_color_count: true
      validate_grid: true
      thumbnail_scale: 8

  pixel_prop_64:
    display_name: "Prop Pixel Art 64×64"
    capability: "text_to_image.pixel"
    pipeline: "pixel.character"
    pixel_profile: "pixel_prop_64_strict"
    asset:
      type: "prop"
      mode: "pixel"
    output:
      logical_width: 64
      logical_height: 64
      # Ver a nota sobre render x modelo em `pixel_character_64`.
      render_width: 512
      render_height: 512
      variations: 4
      transparent: true
    palette:
      size: 16
      strategy: "adaptive"
    postprocessing:
      pixel_cleanup: true
      antialiasing: false
      alpha_threshold: 128
      validate_color_count: true
      validate_grid: true
      thumbnail_scale: 4

  studio_character:
    display_name: "Personagem 2D convencional"
    capability: "text_to_image.general"
    pipeline: "studio.character"
    asset:
      type: "character"
      mode: "studio"
    output:
      render_width: 1024
      render_height: 1024
      variations: 2
      transparent: true
    postprocessing:
      thumbnail_scale: 0.25

  studio_background:
    display_name: "Background 2D convencional"
    capability: "text_to_image.general"
    pipeline: "studio.character"
    asset:
      type: "background"
      mode: "studio"
    output:
      render_width: 1024
      render_height: 576
      variations: 2
      transparent: false
    postprocessing:
      thumbnail_scale: 0.25

  raw_image:
    display_name: "Geração bruta (diagnóstico de motor)"
    capability: "text_to_image.general"
    pipeline: "raw.image"
    asset:
      type: "raw"
      mode: "studio"
    output:
      render_width: 512
      render_height: 512
      variations: 1
      transparent: false
    postprocessing: {}
