# ---------------------------------------------------------------------------
# AssetFlow — Política de roteamento por capacidade (plano §13)
# ---------------------------------------------------------------------------
# O AssetFlow nunca pede um modelo pelo nome. Ele pede uma CAPACIDADE.
# A ordem abaixo é a ordem de preferência; o EngineResolver percorre a lista
# e usa o primeiro motor registrado, habilitado, compatível e saudável.
#
# Desde a Fase A do plano do app (backend/docs/PLANO_APP_DESENHISTA.md) o app
# tem um gerador só: a `desenhista-v1`. As rotas Pixel listam só ela, não há
# rota para as capacidades 2D (o modo Studio saiu), o fallback está desligado
# e motor fora da lista não entra na cadeia. Um mock nunca gera no lugar da
# desenhista: além desta lista, as gavetas de referência nem são registradas
# fora dos testes (`AppEnvironment.TEST`).
#
# Os testes de mecanismo — roteamento, troca de motor, fallback — trocam esta
# política pela deles, com as gavetas de referência (`tests/conftest.py`).
#
# A desenhista só desenha com receita. Um pedido sem receita falha com a
# mensagem dela; não há outra gaveta para tentar.
# ---------------------------------------------------------------------------

routing:
  text_to_image.pixel:
    engines:
      - desenhista-v1

  character.pixel:
    engines:
      - desenhista-v1

  prop.pixel:
    engines:
      - desenhista-v1

fallback:
  # Fallback automático entre motores (plano §44). Desligado: com um gerador
  # só, o único "outro motor" possível seria um mock.
  enabled: false
  # Número máximo de motores tentados por request (o primeiro + N-1 fallbacks).
  max_engine_attempts: 1
  # Se `true`, motores DEGRADED entram como último recurso quando não há
  # nenhuma alternativa saudável.
  allow_degraded_as_last_resort: true

# Com `true`, o resolver completaria a lista com qualquer gaveta registrada
# que declarasse a capacidade — era por aí que um mock entrava no lugar da
# desenhista no antigo modo "Automático". Fica desligado.
allow_unlisted_engines: false
