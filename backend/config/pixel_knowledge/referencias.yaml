# Referências do projeto: quais pacotes de data/referencias/ valem como estilo.
#
# Os pacotes em si ficam em backend/data/referencias/<id>/ e não vão para o
# git (são arte de terceiros); importe com:
#
#   python -m assetflow.referencias importar <zip|pasta> --pacote <id> ...
#
# e confira com `python -m assetflow.referencias listar`. Detalhes em
# backend/docs/REFERENCIAS.md.
#
# Só CC0 entra direto. Um pacote de outra licença (coleção `atribuicao`) só
# entra com o aceite explícito:
#
#   ativos:
#     - pacote-cc0
#     - pacote-cc-by: {aceitar_atribuicao: true}
#
# Pacote listado aqui e ausente da pasta vira aviso, e a linha do recorte sai
# sem ele. Lista vazia: nada muda em relação a não ter referências.

ativos:
  - customizable-character-pack
  - pixel-character-base-64
  - dungeontileset-ii
  - kings-and-pigs
  - ninja-adventure
  # Segunda leva (2026-11-25). Quadro conferido nos arquivos, não no nome:
  # backend/docs/REFERENCIAS_FONTES.md tem o que entrou e o que ficou de fora.
  - pixel-adventure
  - sunny-land
  - hylsy-64-character
  - ninja-animated
  - super-sprite-boy

porte:
  # Referências de "porte parecido": altura do conteúdo dentro de
  # altura do corpo do pedido × (1 ± faixa). Para o humanóide 32×32 (28 px),
  # 0.2 dá 23 a 33 px. A altura de conteúdo inclui chapéu e arma.
  faixa_altura:      {valor: 0.2, classe: style, secao: "§2", a_calibrar: true}
  # Menos quadros que isto numa parte da linha `referências:`, e ela some.
  minimo_de_quadros: {valor: 3,   classe: style, secao: "§2", a_calibrar: true}
  # Pacote com menos quadros que isto NUMA PARTE (estilo ou porte) sai dela.
  # Com peso igual por pacote, 1 quadro pesava como os 400 de outro pacote.
  # 30 é um proxy de "mais que as animações de um personagem": os 26 quadros
  # do kings-and-pigs no porte do humanóide 32 são todos do King Human (com
  # martelo) e levavam a largura de 0,57× para 1,04× a altura.
  minimo_por_pacote: {valor: 30,  classe: style, secao: "§2", a_calibrar: true}
  # Menos pacotes que isto numa parte, depois do filtro acima, e ela some da
  # linha e do `ver_referencia` (que cai para o estilo, de qualquer tamanho).
  # Um pacote só é o estilo dele, não uma referência: o porte do humanóide 32
  # viria só do corpo-base sem roupa do customizable-character-pack. O
  # `calibrar` continua mostrando a parte, marcada como insuficiente.
  minimo_de_pacotes: {valor: 2,   classe: style, secao: "§2", a_calibrar: true}

olho:
  # O olho do app (Fase B2): o desenho novo medido contra as referências do
  # mesmo porte. Só informa — nenhum desvio reprova; a exceção é a guarda
  # `iou_copia` (o desenho repete o exemplo de construção mostrado).
  # backend/docs/OLHAR.md.
  #
  # Fora de [p_baixo, p_alto] das referências (peso igual por pacote) é desvio.
  p_baixo:          {valor: 0.1,  classe: style, secao: "§17", a_calibrar: true}
  p_alto:           {valor: 0.9,  classe: style, secao: "§17", a_calibrar: true}
  # Camadas vizinhas da receita com valores medianos (L*) a menos disto uma da
  # outra "têm o mesmo valor" (§3: contraste de valor antes de matiz). Na
  # arqueira de 2026-11-25, corpo, braços e aljava deram ΔL* 0 e a capa, 2.
  contraste_minimo: {valor: 8,    classe: style, secao: "§3", a_calibrar: true}
  # IoU da silhueta do desenho com a do exemplo mostrado no pedido, no melhor
  # alinhamento, a partir do qual o desenho é não aprovado por repetir o exemplo.
  iou_copia:        {valor: 0.85, classe: semantic, secao: "§3", a_calibrar: true}
  # Cantos em L, dobras (2×2) e degraus fora de progressão por 100 px do
  # contorno escuro (lote F1, FUNDAMENTOS §4): acima disto é desvio. p90 dos
  # quadros com contorno "escuro único" dos pacotes ativos, peso igual por
  # pacote, medido em 2026-11-26 por scripts/calibrar_linha.py — character:
  # 3.320 quadros de 7 pacotes (p50 2,2 / 0 / 2,4); prop: 248 de 5; tile: 411
  # de 5 (p50 0 nos três). Os pacotes têm canto em L: a regra do §4 não é
  # absoluta, e o olho só acusa o que passa do p90.
  linha:
    character: {cantos: 6.3, dobras: 3.5, degraus: 5.6, classe: style, secao: "§4", a_calibrar: true}
    prop:      {cantos: 5.9, dobras: 0.4, degraus: 5.3, classe: style, secao: "§4", a_calibrar: true}
    tile:      {cantos: 2.4, dobras: 1.4, degraus: 4.8, classe: style, secao: "§4", a_calibrar: true}
  # Pontilhado (lote F4, §7): personagem e prop com o lado até isto não
  # pontilham ("padrão do spec: dithering nenhum até 32×32"); acima, o padrão
  # xadrez não passa do teto da área ("teto de área, por exemplo 15%, a calibrar").
  pontilhado_ate:   {valor: 32,   classe: style, secao: "§7", a_calibrar: true}
  pontilhado_teto:  {valor: 0.15, classe: style, secao: "§7", a_calibrar: true}
  # Só conta como pontilhado a mancha de janelas 2×2 em xadrez vizinhas: uma
  # janela solta é olho ou detalhe. Com 4 janelas (uma área 3×3), 67 de 3.469
  # personagens e 6 de 257 props de até 32 px dos pacotes ativos acusam (~2%);
  # com 1, 2.392 de 3.469 acusariam (medido em 2026-11-26).
  pontilhado_mancha: {valor: 4,   classe: style, secao: "§7", a_calibrar: true}
