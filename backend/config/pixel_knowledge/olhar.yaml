# Lista de verificação do olhar (Fase B2 do plano do app).
#
# Vai no laudo do `desenhar`, no primeiro olhar de cada pedido, para a base
# servir também para julgar o desenho, e não só para desenhá-lo. Nos remendos,
# vai só uma linha lembrando os nomes. backend/docs/OLHAR.md.
#
# Nenhuma pergunta é inventada: cada uma cita a seção do PIXEL_KNOWLEDGE.md de
# onde sai (`secao`) e, quando a base tem a regra, o trecho dela em outro YAML
# (`de`: "arquivo/forma: trecho" ou "arquivo: trecho"). O teste
# tests/test_olhar_lista.py confere as duas coisas.
#
# A lista é escolhida pela forma, como o recorte: o corpo num personagem
# (`character.body_type`), o tipo nos demais. `character` é a lista de um
# personagem cujo corpo não tem lista própria. Forma sem lista (tile, efeito,
# interface) não recebe lista, e o laudo diz isso.
#
# No texto, {luz} vira a direção de luz do pedido (ou a padrão de luz.yaml).
#
# Toda pergunta é feita de modo que "sim" é o desenho certo: a ficha de
# verificação (lote F5) lê "sim" como passou e "não: <onde>" como não passou.
# Pergunta no negativo ("há pixel solto?") inverteria a ficha.
#
# O que a base ainda não tem para perguntar, e por isso não está aqui:
# - cuidados por categoria de objeto (poção, arma, baú: PIXEL_KNOWLEDGE §10,
#   tabela "Por categoria"), porque não há props.yaml e a lista é escolhida
#   pelo tipo, não pela categoria;
# - tile (emenda 3×3, §11) e efeito (§15): sem regra nos YAML nem prévia
#   ladrilhada (Fase 7).

abertura: "olhar — na imagem: à esquerda ampliada {ampliacao}×, no meio a silhueta em preto, à direita o tamanho real (2× e 1×). Confira:"

# Entra no fim de qualquer lista quando o pedido tem conceito escolhido (lote 1:
# a etapa de conceito). {traco} vira o traço marcante do conceito. §3: "exagere
# o que identifica" — o traço do conceito é o que identifica este personagem.
conceito:
  nome: conceito
  texto: "o desenho entrega o traço marcante do conceito escolhido (\"{traco}\")?"
  secao: "§3"

listas:
  humanoid:
    - nome: silhueta
      texto: "em preto, dá para reconhecer o personagem, e o item que o identifica muda o contorno?"
      secao: "§3"
      de: "proporcoes.yaml/humanoid: o equipamento muda o contorno do corpo"
    - nome: valores
      texto: "partes vizinhas têm valores diferentes, ou se confundem se você pensar em cinza?"
      secao: "§3"
      de: "proporcoes.yaml/humanoid: partes vizinhas com valores diferentes"
    - nome: luz
      texto: "vem {luz} em todas as partes, com a sombra do lado oposto, e não só seguindo o contorno?"
      secao: "§6"
      de: "luz.yaml: luz do lado de onde ela vem e sombra no oposto"
    - nome: rosto
      texto: "no tamanho real, os olhos e o rosto se leem?"
      secao: "§9"
    - nome: limpeza
      texto: "o contorno está limpo — sem pixel solto, serrilhado nem curva com degraus irregulares (como 3, 1, 3)?"
      secao: "§4"
    - nome: assimetria
      texto: "há uma assimetria intencional (pose, arma, cabelo ou capa), ou a figura parece carimbo?"
      secao: "§3"
      de: "proporcoes.yaml/humanoid: uma assimetria intencional"

  prop:
    - nome: silhueta
      texto: "em preto, dá para reconhecer o objeto num relance?"
      secao: "§10"
    - nome: uma ideia
      texto: "é um objeto só, sem cena dentro do ícone?"
      secao: "§10"
      de: "proporcoes.yaml/prop: um objeto, uma ideia"
    - nome: faces
      texto: "cada face tem um valor — topo mais claro, frente média, sombra embaixo?"
      secao: "§6"
      de: "proporcoes.yaml/prop: um valor por face"
    - nome: luz
      texto: "vem {luz}, a mesma dos outros assets do projeto?"
      secao: "§17"
      de: "luz.yaml: luz do lado de onde ela vem"
    - nome: limpeza
      texto: "o contorno está limpo, sem pixel solto nem serrilhado, e a arma longa (se houver) está na diagonal de 45°?"
      secao: "§8"
      de: "proporcoes.yaml/prop: arma longa na diagonal de 45°"

  # Personagem cujo corpo não tem lista própria (quadrúpede, voador...): só o
  # que vale para qualquer forma.
  character:
    - nome: silhueta
      texto: "em preto, dá para reconhecer a criatura e a forma do corpo dela?"
      secao: "§3"
    - nome: valores
      texto: "partes vizinhas têm valores diferentes, ou se confundem se você pensar em cinza?"
      secao: "§3"
    - nome: luz
      texto: "vem {luz} em todas as partes, com a sombra do lado oposto, e não só seguindo o contorno?"
      secao: "§6"
      de: "luz.yaml: luz do lado de onde ela vem e sombra no oposto"
    - nome: limpeza
      texto: "o contorno está limpo — sem pixel solto, serrilhado nem curva com degraus irregulares (como 3, 1, 3)?"
      secao: "§4"
