# Paletas nomeadas e rampas por material (PIXEL_KNOWLEDGE.md §5).
#
# Os hexadecimais foram copiados de https://lospec.com/palette-list/<id>.json
# em 2026-11-25, na ordem em que o Lospec os publica (em minúsculas). Não
# digite cor de memória: para conferir ou acrescentar uma paleta, baixe o JSON
# de novo. `autor` só aparece quando o próprio Lospec o informa.
#
# `contorno` é a cor mais escura da paleta. `rampas` vão do escuro ao claro
# (a carga confere pela luminância) e só usam cores da própria paleta; quais
# cores formam cada rampa é curadoria desta base, não do autor da paleta.
# Paleta sem `rampas` fica para a troca de paleta (Fase 4), não para o recorte.

# A paleta que o recorte oferece quando o pedido não trava a paleta. O código
# não tem paleta padrão: sem esta chave, o recorte sai sem rampas.
mestra: endesga-32

paletas:
