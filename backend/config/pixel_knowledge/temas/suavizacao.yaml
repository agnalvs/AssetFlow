     etiquetas: {tamanho: [32, 4096]}}
  - {texto: "o tom intermediário é um vizinho da rampa, não a média das duas cores",
     classe: style, secao: "§7", verificacao: "autora",
     fonte: "https://pixelparmesan.com/anti-aliasing-fundamentals-for-pixel-artists",
     etiquetas: {tamanho: [32, 4096]}}
  - {texto: "degrau longo pede suavização longa; trechos iguais e paralelos à borda fazem faixa",
     classe: style, secao: "§7", verificacao: "construcao:suavizar",
     etiquetas: {tamanho: [32, 4096]}}
