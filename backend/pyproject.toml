[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assetflow-backend"
version = "0.1.0"
description = "AssetFlow — infraestrutura modular de geração de assets para jogos 2D (Pixel Art e arte 2D convencional)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "PyYAML>=6.0",
    "Pillow>=10.3",
    # Representação RGBA, máscaras, contagem de cores e análise de vizinhança
    # do módulo Pixel Exact (plano Pixel §108). Não é biblioteca de IA: é
    # álgebra sobre arrays, e por isso pode viver fora das gavetas.
    "numpy>=1.26",
]

[project.optional-dependencies]
# Dependências de desenvolvimento e testes.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Servidor MCP do AssetFlow (`python -m assetflow.mcp`, plano desenhista §4,
# Fase 2): o Claude desenha pela conversa. A v2 do SDK trocou `FastMCP` por
# `MCPServer` e removeu o caminho antigo, daí o teto em <3.
mcp = [
    "mcp>=2.3,<3",
]
# Uma gaveta que precise de biblioteca própria declara um extra aqui, com o
# nome dela. IMPORTANTE (regra de ouro §74 do plano): essas bibliotecas só
# podem ser importadas de dentro de `assetflow/generation/engines/<gaveta>/`,
# e `tests/test_architecture_boundaries.py` falha se isso for violado.

[tool.setuptools.packages.find]
where = ["."]
include = ["assetflow*"]

[tool.setuptools.package-data]
"assetflow" = ["**/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
# Mantém os diretórios temporários dos testes no disco do projeto, em vez de
# espalhá-los pelo perfil do usuário (que costuma ser o disco pequeno).
addopts = "--basetemp=.pytest-tmp"
